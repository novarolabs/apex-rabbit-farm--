<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Rabbit Farm — Admin</title>
  <link rel="icon" href="../assets/logo/favicon.png" type="image/png">
  <!-- Prevents search engines from indexing the admin panel -->
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <!-- Netlify Identity: handles the login popup and invite links -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Decap CMS (formerly Netlify CMS): the actual admin interface -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
